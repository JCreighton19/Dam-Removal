# Case-study configuration for the first end-to-end pilot watershed.
#
# To run a different case study (a different watershed, or eventually a
# multi-HUC8 or national scope), copy this file rather than editing scripts
# directly, and pass --case-study <new_file_stem> on the command line.

case_study: pilot_19020401

# One or more HUC8 watershed codes that define this case study's scope.
huc8s:
  - "19020401"

# Paths are relative to the project root unless absolute.
dam_source: data/raw/dams/ARDamRemovalList_Figshare_Mar2026.csv
wbd_source: data/raw/wbd/WBD_National_GPKG.gpkg

# WQP MonitoringLocationTypeName values treated as surface-water stations.
station_types:
  - "Stream"
  - "River/Stream"

# Water-quality analysis window (etl/report_pilot_eligibility.py and,
# later, the full analysis-window builder). See that script's module
# docstring for the exact definition of "pre"/"post"/removal year.
wq_window:
  years_before: 5
  years_after: 5

# Which dam-station links count (etl/build_views.py; docs/warehouse_spec.md
# section 5, "Link distance limits"). dam_station_link keeps every link;
# these limit the ones eligibility, exposure and the analysis dataset use.
# Small-dam effects are local (warming fades within ~1-2 km, Zaidel et al.
# 2021), and the DAR sensitivity analysis (notebooks/dar_sensitivity.ipynb)
# found distance does nearly all the filtering. Remove a limit (or set it to
# null) to link every connected station, e.g. for that sensitivity analysis.
exposure:
  max_downstream_km: 10
  max_upstream_km: 10

# WQP CharacteristicName values of interest, seeded from the exploratory
# notebooks. Kept as exact source strings deliberately -- e.g. "Oxygen" and
# "Dissolved oxygen (DO)" are NOT treated as the same characteristic, since
# they are not known to be comparable. Extend this list as needed; nothing
# downstream assumes it is exhaustive.
wq_characteristics:
  - "Dissolved oxygen (DO)"
  - "Temperature, water"
  - "Turbidity"
  - "pH"
  - "Nitrate"
  - "Phosphorus"
